<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team Task Manager</title>
  
  <!-- Core Libraries -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    function SimpleTaskManager() {
      const [tasks, setTasks] = useState([
        { id: 1, title: 'Annual Audit Prep', group: 'Finance', assignee: 'Sarah Jenkins', status: 'In Progress', priority: 'High' },
        { id: 2, title: 'Onboard New Engineers', group: 'HR', assignee: 'Alex Rivera', status: 'Not Started', priority: 'Medium' },
        { id: 3, title: 'Server OS Patching', group: 'IT', assignee: 'David Chen', status: 'Under Review', priority: 'Urgent' }
      ]);
      const [selectedGroup, setSelectedGroup] = useState('All');
      const [newTitle, setNewTitle] = useState('');
      const [newGroup, setNewGroup] = useState('HR');

      const filteredTasks = useMemo(() => {
        return tasks.filter(t => selectedGroup === 'All' || t.group === selectedGroup);
      }, [tasks, selectedGroup]);

      const addTask = (e) => {
        e.preventDefault();
        if (!newTitle.trim()) return;
        setTasks([...tasks, {
          id: Date.now(),
          title: newTitle,
          group: newGroup,
          assignee: 'Unassigned',
          status: 'Not Started',
          priority: 'Medium'
        }]);
        setNewTitle('');
      };

      return (
        <div className="max-w-6xl mx-auto p-6">
          <header className="mb-8 border-b border-slate-800 pb-4 flex justify-between items-center">
            <div>
              <h1 className="text-2xl font-bold text-white">Team Task Manager</h1>
              <p className="text-slate-400 text-sm">Track team task progress by Task Group</p>
            </div>
            <div className="flex gap-2">
              <label className="text-sm self-center text-slate-300">Filter Group:</label>
              <select 
                value={selectedGroup} 
                onChange={(e) => setSelectedGroup(e.target.value)}
                className="bg-slate-800 text-white border border-slate-700 rounded px-3 py-1.5 text-sm"
              >
                <option value="All">All Groups</option>
                <option value="HR">HR</option>
                <option value="Finance">Finance</option>
                <option value="IT">IT</option>
                <option value="Marketing">Marketing</option>
              </select>
            </div>
          </header>

          <!-- Add Task Form -->
          <form onSubmit={addTask} className="bg-slate-800 p-4 rounded-lg mb-6 flex gap-3">
            <input 
              type="text" 
              placeholder="Enter new task name..." 
              value={newTitle}
              onChange={(e) => setNewTitle(e.target.value)}
              className="flex-1 bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm text-white focus:outline-none"
            />
            <select 
              value={newGroup}
              onChange={(e) => setNewGroup(e.target.value)}
              className="bg-slate-900 border border-slate-700 text-white rounded px-3 py-2 text-sm"
            >
              <option value="HR">HR</option>
              <option value="Finance">Finance</option>
              <option value="IT">IT</option>
              <option value="Marketing">Marketing</option>
            </select>
            <button type="submit" className="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded text-sm font-medium">
              Add Task
            </button>
          </form>

          <!-- Task Table -->
          <div className="bg-slate-800 rounded-lg overflow-hidden border border-slate-700">
            <table className="w-full text-left border-collapse">
              <thead>
                <tr className="bg-slate-900/50 text-slate-400 text-xs uppercase border-b border-slate-700">
                  <th className="p-3">Task Title</th>
                  <th className="p-3">Task Group</th>
                  <th className="p-3">Assignee</th>
                  <th className="p-3">Priority</th>
                  <th className="p-3">Status</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-700/50 text-sm">
                {filteredTasks.map((task) => (
                  <tr key={task.id} className="hover:bg-slate-700/30">
                    <td className="p-3 font-medium text-white">{task.title}</td>
                    <td className="p-3">
                      <span className="px-2 py-0.5 text-xs rounded bg-purple-900/50 text-purple-300 border border-purple-700/50">
                        {task.group}
                      </span>
                    </td>
                    <td className="p-3 text-slate-300">{task.assignee}</td>
                    <td className="p-3">
                      <span className="px-2 py-0.5 text-xs rounded bg-amber-900/40 text-amber-300">
                        {task.priority}
                      </span>
                    </td>
                    <td className="p-3">
                      <span className="px-2 py-0.5 text-xs rounded bg-blue-900/40 text-blue-300">
                        {task.status}
                      </span>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<SimpleTaskManager />);
  </script>
</body>
</html>
